global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: calendar
    static_configs:
      - targets:
          - calendar:8080

  - job_name: scheduler
    static_configs:
      - targets:
          - scheduler:8081

  - job_name: storer
    static_configs:
      - targets:
          - storer:8082
