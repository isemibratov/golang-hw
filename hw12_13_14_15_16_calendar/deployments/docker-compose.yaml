services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrations:
    image: migrate/migrate:v4.18.3
    command:
      - -path=/migrations
      - -database=postgres://calendar:calendar@postgres:5432/calendar?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations:ro
    restart: "no"

  zookeeper:
    image: zookeeper:3.9.5-jre-17
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: srvr
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 5s
      timeout: 10s
      retries: 12

  kafka:
    image: apache/kafka:3.9.2
    entrypoint: ["/opt/kafka/bin/kafka-server-start.sh"]
    command: ["/etc/kafka/server.properties"]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    volumes:
      - ./kafka/server.properties:/etc/kafka/server.properties:ro
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-topics.sh
        - --bootstrap-server
        - localhost:29092
        - --list
      interval: 5s
      timeout: 10s
      retries: 12

  calendar:
    image: calendar-api:develop
    build:
      context: ..
      dockerfile: build/calendar/Dockerfile
      args:
        LDFLAGS: ${LDFLAGS:-}
    environment:
      CALENDAR_LOGGER_LEVEL: info
      CALENDAR_HTTP_HOST: 0.0.0.0
      CALENDAR_HTTP_PORT: 8080
      CALENDAR_STORAGE_TYPE: sql
      CALENDAR_STORAGE_DSN: postgres://calendar:calendar@postgres:5432/calendar?sslmode=disable
    depends_on:
      migrations:
        condition: service_completed_successfully
    ports:
      - "${CALENDAR_HOST_PORT:-8888}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/hello"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  scheduler:
    image: calendar-scheduler:develop
    build:
      context: ..
      dockerfile: build/calendar_scheduler/Dockerfile
    environment:
      CALENDAR_LOGGER_LEVEL: info
      CALENDAR_STORAGE_TYPE: sql
      CALENDAR_STORAGE_DSN: postgres://calendar:calendar@postgres:5432/calendar?sslmode=disable
      CALENDAR_KAFKA_BROKERS: kafka:29092
      CALENDAR_KAFKA_TOPIC: calendar.notifications
    depends_on:
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/metrics"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  storer:
    image: calendar-storer:develop
    build:
      context: ..
      dockerfile: build/calendar_storer/Dockerfile
    environment:
      CALENDAR_LOGGER_LEVEL: info
      CALENDAR_STORAGE_TYPE: sql
      CALENDAR_STORAGE_DSN: postgres://calendar:calendar@postgres:5432/calendar?sslmode=disable
      CALENDAR_KAFKA_BROKERS: kafka:29092
      CALENDAR_KAFKA_TOPIC: calendar.notifications
      CALENDAR_KAFKA_GROUP_ID: calendar-storer
    depends_on:
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/metrics"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "${CALENDAR_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://127.0.0.1:9090"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

volumes:
  postgres-data:
