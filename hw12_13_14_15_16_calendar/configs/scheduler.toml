[logger]
level = "info"

[metrics]
host = "0.0.0.0"
port = 8081

[storage]
type = "sql"
dsn = "postgres://calendar:calendar@localhost:5432/calendar?sslmode=disable"

[kafka]
brokers = ["localhost:9092"]
topic = "calendar.notifications"
connect_timeout = "5s"
retry_initial = "500ms"
retry_max = "10s"
write_timeout = "10s"
max_message_bytes = 1048576

[scheduler]
interval = "1m"
batch_size = 100
retention_years = 1
